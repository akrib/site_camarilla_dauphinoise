<body class="gze-page">

<header class="gze-barre">

  </div>
  <span class="gze-badge" id="badgeStatut"></span>
  <span class="gze-espace"></span>
  <div class="gze-groupe">
    <button class="gze-btn" id="btnLocal" title="Enregistrer dans ce navigateur (Ctrl+S) — aucune écriture en ligne">💾 Sauvegarde locale</button>
    <button class="gze-btn" id="btnSite" title="Enregistrer sur le site : les autres conteurs le voient ; les joueurs seulement une fois publié">☁ Sauvegarder sur le site</button>

      <button data-onglet="pensebete">Pense-bête <span class="n" id="nPenseBete"></span></button>
      <button data-onglet="reglages">Réglages</button>

  </aside>
  <main class="gze-plan" id="plan" aria-label="Mise en page"></main>
</div>

  <div class="gze-apercu-barre">
    <strong>Prévisualisation</strong>
    <div class="gze-segment" role="group" aria-label="Mode">
      <button data-mode="ecran" class="actif">Écran (joueurs)</button>
      <button data-mode="impression">Impression A4 (noir et blanc)</button>
    </div>
    <span class="gze-apercu-info" id="apercuInfo"></span>
    <span class="gze-espace"></span>
    <button class="gze-btn" id="btnImprimer">🖨 Imprimer</button>
